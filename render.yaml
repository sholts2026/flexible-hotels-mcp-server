# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One-time setup:
#   1. Push this repo to your own GitHub account (public or private).
#   2. In the Render dashboard: New -> Blueprint -> select this repo.
#   3. Click "Apply" — Render builds the Dockerfile and gives you a public URL
#      like https://flexible-hotels-mcp-server.onrender.com
#   4. Use https://<that-url>/mcp as the remote MCP server URL in your AI client.
#
# No API key is required — the server runs fully in free "link-only" mode out of the
# box. Optionally, set STAYAPI_KEY in the Render dashboard's Environment tab (a free
# one-time 50-request trial key from https://stayapi.com, no credit card) to switch
# to real, live, cheapest-first price comparison.
#
# Free tier: no credit card required, but the service sleeps after 15 minutes
# of inactivity (first request after sleeping takes ~30-60s to wake up).

services:
  - type: web
    name: flexible-hotels-mcp-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: STAYAPI_KEY
        sync: false
      - key: TRANSPORT
        value: http
    healthCheckPath: /healthz
